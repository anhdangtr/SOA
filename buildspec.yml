version: 0.2

env:
  shell: bash
  variables:
    CI: "true"
    FRONTEND_CONTAINER_NAME: "frontend"
    FRONTEND_ECR_REPO: "gaumuoi-frontend"
    VITE_API_MODE: "live"
    VITE_DELIVERY_API_MODE: "live"

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - set -euo pipefail
      - echo "Using Node $(node --version) and npm $(npm --version)"

  pre_build:
    commands:
      - echo "Installing frontend dependencies"
      - cd Frontend && npm ci && cd ..
      - echo "Running frontend checks"
      - cd Frontend && npm run lint && npm run build && cd ..
      - echo "Logging in to Amazon ECR"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      - COMMIT_HASH="$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c 1-7)"
      - IMAGE_TAG="${COMMIT_HASH:=latest}"
      - FRONTEND_IMAGE_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$FRONTEND_ECR_REPO"

  build:
    commands:
      - echo "Building frontend Docker image with tag $IMAGE_TAG"
      - docker build --target production -t "$FRONTEND_IMAGE_URI:$IMAGE_TAG" -t "$FRONTEND_IMAGE_URI:latest" --build-arg VITE_API_MODE="$VITE_API_MODE" --build-arg VITE_DELIVERY_API_MODE="$VITE_DELIVERY_API_MODE" --build-arg VITE_ORDER_SERVICE_URL="${VITE_ORDER_SERVICE_URL:-}" --build-arg VITE_PAYMENT_SERVICE_URL="${VITE_PAYMENT_SERVICE_URL:-}" --build-arg VITE_DELIVERY_SERVICE_URL="${VITE_DELIVERY_SERVICE_URL:-}" ./Frontend

  post_build:
    commands:
      - echo "Pushing frontend image to Amazon ECR"
      - docker push "$FRONTEND_IMAGE_URI:$IMAGE_TAG"
      - docker push "$FRONTEND_IMAGE_URI:latest"
      - echo "Writing ECS deployment artifact"
      - printf '[{"name":"%s","imageUri":"%s"}]' "$FRONTEND_CONTAINER_NAME" "$FRONTEND_IMAGE_URI:$IMAGE_TAG" > imagedefinitions-frontend.json
      - printf '{"imageTag":"%s","sourceVersion":"%s"}\n' "$IMAGE_TAG" "$CODEBUILD_RESOLVED_SOURCE_VERSION" > build-metadata.json

artifacts:
  files:
    - imagedefinitions-frontend.json
    - build-metadata.json

cache:
  paths:
    - /root/.npm/**/*
