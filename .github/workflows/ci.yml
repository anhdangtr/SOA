name: Frontend CI

on:
  pull_request:
    paths:
      - "Frontend/**"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
      - develop
    paths:
      - "Frontend/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  frontend:
    name: Lint And Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build production image
        run: >
          docker build
          --target production
          -t gaumuoi-frontend-ci
          --build-arg VITE_API_MODE=live
          --build-arg VITE_DELIVERY_API_MODE=live
          --build-arg VITE_ORDER_SERVICE_URL=http://example.com/order
          --build-arg VITE_PAYMENT_SERVICE_URL=http://example.com/payment
          --build-arg VITE_DELIVERY_SERVICE_URL=http://example.com/delivery
          .
