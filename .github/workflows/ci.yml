name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Lint And Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Build production image
        run: docker build --target production -t gaumuoi-frontend-ci .

  backend:
    name: Backend Checks (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: order
            path: Backend_Order
            node: 20
            check: node --check server.js
          - name: payment
            path: Backend_Payment
            node: 20
            check: node --check server.js
          - name: delivery
            path: Backend_Delivery
            node: 20
            check: npm run check
    defaults:
      run:
        working-directory: ${{ matrix.service.path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.service.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.service.path }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: ${{ matrix.service.check }}

      - name: Build production image
        run: docker build --target production -t gaumuoi-${{ matrix.service.name }}-ci .
