name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Prepare Metadata
    runs-on: ubuntu-latest
    outputs:
      image_owner: ${{ steps.owner.outputs.value }}
    steps:
      - name: Normalize image owner
        id: owner
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build And Push (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: frontend
            context: ./Frontend
            dockerfile: ./Frontend/Dockerfile
            target: production
            build_args: |
              VITE_API_MODE=live
              VITE_DELIVERY_API_MODE=live
              VITE_ORDER_SERVICE_URL=${{ vars.VITE_ORDER_SERVICE_URL }}
              VITE_PAYMENT_SERVICE_URL=${{ vars.VITE_PAYMENT_SERVICE_URL }}
              VITE_DELIVERY_SERVICE_URL=${{ vars.VITE_DELIVERY_SERVICE_URL }}
          - name: backend-order
            context: ./Backend_Order
            dockerfile: ./Backend_Order/Dockerfile
            target: production
            build_args: ""
          - name: backend-payment
            context: ./Backend_Payment
            dockerfile: ./Backend_Payment/Dockerfile
            target: production
            build_args: ""
          - name: backend-delivery
            context: ./Backend_Delivery
            dockerfile: ./Backend_Delivery/Dockerfile
            target: production
            build_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image_owner }}/gaumuoi-${{ matrix.service.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          target: ${{ matrix.service.target }}
          push: true
          build-args: ${{ matrix.service.build_args }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy To Docker Host
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build-and-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose bundle
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: deploy
          target: ${{ secrets.DEPLOY_PATH }}
          strip_components: 1

      - name: Deploy release
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_OWNER: ${{ needs.prepare.outputs.image_owner }}
          GITHUB_SHA: ${{ github.sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          envs: IMAGE_OWNER,GITHUB_SHA,GHCR_USERNAME,GHCR_TOKEN,DEPLOY_PATH
          script: |
            set -eu

            cd "$DEPLOY_PATH"
            mkdir -p env

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

            export IMAGE_OWNER
            export IMAGE_TAG="sha-${GITHUB_SHA}"

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -af --filter "until=168h"
